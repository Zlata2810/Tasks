<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 02</title>
</head>

<body>
    <input type="number" id="radius" placeholder="Введите радиус">
    <input type="number" id="height" placeholder="Введите высоту">

    <button onclick="calculateVolume()">Рассчитать</button>

    <script>
        /*
        Задание:
        Напишите сценарий, который вычисляет объем цилиндра по параметрам, которые вводит пользователь.
        Для расчета используйте формулу - V=π * r в квадрате * h
        Разместите на странице два поля ввода - первое для радиуса цилиндра, второе для высоты цилиндра.
        Объем цилиндра выведите в тело страницы.
        */
       function calculateVolume() {
            let radius = Number(document.querySelector("#radius").value);
            let height = Number(document.querySelector("#height").value);

            let volume = 3.14 * radius ** 2 * height;

            document.write("Объем цилиндра: " + volume);
        }
    </script>
</body>

</html>
